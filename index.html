<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Patriot Orbit</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #000 url('background.jpg') center/cover no-repeat fixed;
      color: #e8eef7;
      min-height: 100vh;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0, 5, 15, 0.55);
      z-index: -1;
    }
    header {
      text-align: center;
      padding: 50px 20px 30px;
    }
    header img {
      width: 320px;
      max-width: 90%;
      height: auto;
      filter: drop-shadow(0 8px 24px rgba(0,0,0,0.7));
    }
    .tagline {
      margin-top: 14px;
      font-size: 15px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #c0c8d4;
      font-weight: 500;
    }
    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 20px 20px 80px;
    }
    h2 {
      font-size: 22px;
      font-weight: 600;
      margin: 30px 0 16px;
      color: #fff;
    }
    .notes {
      background: rgba(10, 15, 25, 0.75);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 28px;
      backdrop-filter: blur(6px);
      font-family: 'SF Mono', Monaco, Consolas, monospace;
      font-size: 15px;
      line-height: 1.65;
      white-space: pre-wrap;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }
    .download {
      display: inline-block;
      margin-top: 28px;
      background: linear-gradient(135deg, #b91c1c, #1e40af);
      color: white;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-weight: 600;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 14px rgba(185, 28, 28, 0.3);
    }
    footer {
      text-align: center;
      padding: 30px;
      font-size: 13px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Patriot Orbit">
    <div class="tagline">Adversary Space Activity Intelligence</div>
  </header>

  <main>
    <h2>Latest Activity Notes</h2>
    <div class="notes" id="notes">Loading latest notes...</div>
    <a class="download" href="MASTER_ALL_SPACE_OBJECTS.csv">Download Full Master CSV</a>
  </main>

  <footer>
    Patriot Orbit · Open Source Space Domain Awareness
  </footer>

  <script>
    fetch('AUTO_NOTES.txt')
      .then(r => r.ok ? r.text() : Promise.reject())
      .then(text => {
        document.getElementById('notes').textContent = text || 'No notes available yet.';
      })
      .catch(() => {
        document.getElementById('notes').textContent = 'Notes file not found or unavailable.';
      });
  </script>
</body>
</html>
