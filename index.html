<!DOCTYPE html>
<html>
<head>
  <title>Patriot Orbit</title>
  <meta charset="UTF-8">
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; line-height: 1.6; }
    pre { background: #f4f4f4; padding: 15px; border-radius: 5px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Patriot Orbit</h1>
  <p>Latest adversary space activity notes (auto-updated):</p>
  <pre id="notes">Loading...</pre>
  <p><a href="MASTER_ALL_SPACE_OBJECTS.csv">Download full master CSV</a></p>

  <script>
    fetch('AUTO_NOTES.txt')
      .then(r => r.text())
      .then(text => document.getElementById('notes').textContent = text)
      .catch(() => document.getElementById('notes').textContent = 'Notes not available yet.');
  </script>
</body>
</html>
