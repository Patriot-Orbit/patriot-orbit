<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Patriot Orbit</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0a0e17;
      color: #e8eef7;
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(30, 58, 138, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(185, 28, 28, 0.08) 0%, transparent 40%),
        url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    header {
      text-align: center;
      padding: 50px 20px 30px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    header img {
      width: 320px;
      max-width: 90%;
      height: auto;
      filter: drop-shadow(0 8px 24px rgba(0,0,0,0.6));
    }
    .tagline {
      margin-top: 16px;
      font-size: 15px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #9ca3af;
      font-weight: 500;
    }
    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }
    h2 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    h2::before {
      content: "";
      width: 4px;
      height: 22px;
      background: linear-gradient(to bottom, #dc2626, #1e40af);
      border-radius: 2px;
    }
    pre {
      background: #111827;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 24px;
      white-space: pre-wrap;
      font-family: 'SF Mono', Monaco, Consolas, monospace;
      font-size: 14.5px;
      line-height: 1.6;
      color: #d1d5db;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .download {
      display: inline-block;
      margin-top: 28px;
      background: linear-gradient(135deg, #b91c1c, #1e40af);
      color: white;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 14px rgba(185, 28, 28, 0.3);
    }
    .download:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(185, 28, 28, 0.45);
    }
    footer {
      text-align: center;
      padding: 30px;
      font-size: 13px;
      color: #6b7280;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Patriot Orbit">
    <div class="tagline">Adversary Space Activity Intelligence</div>
  </header>

  <main>
    <h2>Latest Activity Notes</h2>
    <pre id="notes">Loading latest notes...</pre>
    <a class="download" href="MASTER_ALL_SPACE_OBJECTS.csv">Download Full Master CSV</a>
  </main>

  <footer>
    Patriot Orbit · Open Source Space Domain Awareness
  </footer>

  <script>
    fetch('AUTO_NOTES.txt')
      .then(r => r.ok ? r.text() : Promise.reject())
      .then(text => {
        document.getElementById('notes').textContent = text || 'No notes available yet.';
      })
      .catch(() => {
        document.getElementById('notes').textContent = 'Notes file not found or unavailable.';
      });
  </script>
</body>
</html>
