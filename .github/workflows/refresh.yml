name: Refresh Space Data

on:
  schedule:
    - cron: '0 */5 * * *'   # every 5 hours
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install spacetrack pandas
      - run: python pull_and_analyze.py
        env:
          SPACETRACK_USER: ${{ secrets.SPACETRACK_USER }}
          SPACETRACK_PASS: ${{ secrets.SPACETRACK_PASS }}
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-refresh space data and notes"
          file_pattern: "*.csv *.txt"
